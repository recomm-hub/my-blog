name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: ["main"]
  # 毎日 AM6:00 (JST) に自動ビルド → イベントバナーの日付切替を反映
  schedule:
    - cron: "0 21 * * *"   # UTC 21:00 = JST 06:00
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.156.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: Asia/Tokyo
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "https://mononikki.com/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect new articles and notify LINE
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          # draft: false の新規記事を検出
          NEW_FILES=$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- 'content/posts/*/index.md' || true)
          CHANGED_FILES=$(git diff --name-only --diff-filter=M HEAD~1 HEAD -- 'content/posts/*/index.md' || true)
          ALL_FILES="$NEW_FILES $CHANGED_FILES"

          for FILE in $ALL_FILES; do
            [ -z "$FILE" ] && continue
            [ ! -f "$FILE" ] && continue

            # draft: true の記事はスキップ
            if grep -q 'draft: true' "$FILE"; then
              echo "⏭️ Skip (draft): $FILE"
              continue
            fi

            # slug を取得
            SLUG=$(grep -oP 'slug:\s*"\K[^"]+' "$FILE" || echo "")
            if [ -z "$SLUG" ]; then
              # slug がない場合はディレクトリ名から生成
              SLUG=$(basename $(dirname "$FILE"))
            fi

            # タイトルを取得
            TITLE=$(grep -oP 'title:\s*"\K[^"]+' "$FILE" || echo "新しい記事")

            URL="https://mononikki.com/posts/${SLUG}/"

            echo "📤 Sending LINE notification: $TITLE"

            # LINE Messaging API で push message
            curl -s -X POST https://api.line.me/v2/bot/message/push \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${LINE_CHANNEL_ACCESS_TOKEN}" \
              -d "{
                \"to\": \"${LINE_USER_ID}\",
                \"messages\": [
                  {
                    \"type\": \"text\",
                    \"text\": \"📝 記事を公開しました！\n\n${TITLE}\n${URL}\"
                  }
                ]
              }"

            echo ""
            echo "✅ LINE notification sent for: $TITLE"
          done
