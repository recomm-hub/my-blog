baseURL = 'https://mononikki.com/'
languageCode = 'ja'
title = 'ものにっき'
theme = 'hugo-theme-stack'

# 日本語環境の設定
hasCJKLanguage = true
defaultContentLanguage = 'ja'

# ビルド設定
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
ignoreFiles = ['hay-fever-season-guide']

# ページネーション
[pagination]
  pagerSize = 10

# パーマリンク
[permalinks]
  posts = '/posts/:slug/'
  page = '/:slug/'

# SEO用：サイトマップ自動生成
[sitemap]
  changefreq = 'weekly'
  priority = 0.5

# ── Stack テーマの設定 ──
[params]
  mainSections = ['posts']
  featuredImageField = 'image'
  rssFullContent = true
  description = '気になるモノを調べて比べる個人ブログ'

  [params.footer]
    since = 2026
    customText = '© ものにっき'

  [params.dateFormat]
    published = '2006年1月2日'
    lastUpdated = '2006年1月2日 15:04'

  # サイドバー設定
  [params.sidebar]
    emoji = '📝'
    subtitle = '気になるモノを調べて比べる個人ブログ'
    avatar = ''
    compact = false

  # 記事設定
  [params.article]
    headingAnchor = true
    math = false
    toc = true
    readingTime = true

    [params.article.list]
      showTags = true

    [params.article.license]
      enabled = false

  # サイドバーウィジェット（ホームページ）
  [[params.widgets.homepage]]
    type = 'event-banner'

  [[params.widgets.homepage]]
    type = 'search'

  [[params.widgets.homepage]]
    type = 'categories'
    [params.widgets.homepage.params]
      limit = 10

  [[params.widgets.homepage]]
    type = 'tag-cloud'
    [params.widgets.homepage.params]
      limit = 20

  [[params.widgets.homepage]]
    type = 'archives'
    [params.widgets.homepage.params]
      limit = 5

  # サイドバーウィジェット（記事ページ）
  [[params.widgets.page]]
    type = 'event-banner'

  # カラースキーム
  [params.colorScheme]
    toggle = true
    default = 'light'

  # OGP設定
  [params.opengraph.twitter]
    site = ''
    card = 'summary_large_image'

  # 画像処理
  [params.imageProcessing.cover]
    enabled = true

  [params.imageProcessing.content]
    enabled = true

  # コメント無効
  [params.comments]
    enabled = false

# メニュー（サイドバー）
[[menu.main]]
  identifier = 'home'
  name = 'ホーム'
  url = '/'
  weight = -100
  [menu.main.params]
    icon = 'home'

[[menu.main]]
  identifier = 'categories'
  name = 'カテゴリ'
  url = '/categories/'
  weight = -90
  [menu.main.params]
    icon = 'categories'

[[menu.main]]
  identifier = 'tags'
  name = 'タグ'
  url = '/tags/'
  weight = -80
  [menu.main.params]
    icon = 'hash'

[[menu.main]]
  identifier = 'contact'
  name = 'お問い合わせ'
  url = '/contact/'
  weight = -40
  [menu.main.params]
    icon = 'messages'

[[menu.main]]
  identifier = 'privacy'
  name = 'プライバシー'
  url = '/privacy/'
  weight = -30
  [menu.main.params]
    icon = 'link'

[[menu.social]]
  identifier = 'rss'
  name = 'RSS'
  url = '/index.xml'
  [menu.social.params]
    icon = 'rss'

# 出力フォーマット
[outputs]
  home = ['HTML', 'RSS']

# マークアップ設定
[markup]
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = false
    lineNumbersInTable = true
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    endLevel = 4
    ordered = true
    startLevel = 2
