<!-- Stack テーマ用 custom head: AdSense -->
{{- partial "adsense.html" . }}

<!-- Google AdSense -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9979090406145542"
     crossorigin="anonymous"></script>

<!-- Google Search Console 所有権確認 -->
<meta name="google-site-verification" content="3jzQnFFTYA5fjbwJvaRRtXYjNTcDsTzNrAhekBPqiSU" />

<!-- Google Analytics (GA4) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-JCHW65ZDXF"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-JCHW65ZDXF');
</script>

<!-- Google Fonts: Yomogi (手書き風) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yomogi&display=swap" rel="stylesheet">

<!-- JSON-LD Structured Data (Article) -->
{{ if and .IsPage (eq .Section "posts") }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": {{ .Title | jsonify }},
  "description": {{ with .Description }}{{ . | jsonify }}{{ else }}{{ .Summary | plainify | truncate 160 | jsonify }}{{ end }},
  "datePublished": {{ .Date.Format "2006-01-02T15:04:05+09:00" | jsonify }},
  "dateModified": {{ (.Lastmod | default .Date).Format "2006-01-02T15:04:05+09:00" | jsonify }},
  "author": {
    "@type": "Person",
    "name": "ものにっき",
    "url": "https://mononikki.com/about/"
  },
  "publisher": {
    "@type": "Organization",
    "name": "ものにっき",
    "url": "https://mononikki.com/"
  },
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": {{ .Permalink | jsonify }}
  }{{ with .Resources.GetMatch "cover.*" }},
  "image": {{ .Permalink | jsonify }}{{ end }}
}
</script>
{{ end }}
