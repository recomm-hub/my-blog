# ============================================================
# 紹介コード / アフィリエイトリンク 一元管理
#
# ★ 使い方 ★
#   記事内で {{</* referral "rakuten-mobile" */>}} と書くだけ
#   ショートコードが referrals.yaml を参照してカードを出力
#
# ★ 項目説明 ★
#   id       : ショートコードで呼ぶキー
#   name     : 表示名
#   url      : 紹介URL / アフィリエイトURL
#   type     : referral（紹介コード）/ ambassador（アンバサダー）
#   reward   : 読者側の特典の説明
#   cta      : ボタンのテキスト
#   note     : 補足（注意事項など）
#   enabled  : false にすると非表示
#   category : 分類タグ（記事候補選定時の参考）
# ============================================================

referrals:

  # ───────────────────────────────────────────
  #  楽天モバイル 紹介キャンペーン
  # ───────────────────────────────────────────
  - id: "rakuten-mobile"
    name: "楽天モバイル"
    url: "https://r10.to/hFjEs1"
    type: "referral"
    reward: "最大13,000ポイントもらえる"
    cta: "楽天モバイルをチェック"
    note: "Rakuten最強プラン申込＋Rakuten Link 10秒通話が条件"
    enabled: true
    category:
      - "スマホ"
      - "通信費"
      - "節約"

  # ───────────────────────────────────────────
  #  COFO 公式アンバサダー（取得次第 enabled: true にする）
  # ───────────────────────────────────────────
  - id: "cofo"
    name: "COFO（5,000円OFFクーポン）"
    url: ""
    type: "ambassador"
    reward: "COFO公式サイトで5,000円OFF"
    cta: "COFOクーポンを取得"
    note: "Chair/Deskシリーズ対象。3万円以上の注文で適用。1人1回限り"
    enabled: false
    category:
      - "デスクチェア"
      - "デスク環境"
      - "フルリモート"
